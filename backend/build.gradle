plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// Spring Boot 3.4.1's managed Testcontainers version speaks a Docker API too old for this
// host's Docker Engine (API 1.52, min 1.44). Override to a release that supports it.
ext['testcontainers.version'] = '1.21.3'

java {
    sourceCompatibility = '21'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'com.twilio.sdk:twilio:13.0.0'
    implementation 'com.google.firebase:firebase-admin:9.11.0'
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // In-memory rate limiting (S1): single-container deployment, no Redis.
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.14.0'
    // Bounded eviction for the per-key bucket cache so memory can't grow unbounded.
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def loadEnv() {
    def envMap = [:]
    def envFiles = [
        rootProject.file('.env'),
        project.file('.env')
    ]
    for (File f : envFiles) {
        if (f.exists()) {
            f.eachLine { line ->
                line = line.trim()
                if (line && !line.startsWith('#') && line.contains('=')) {
                    int idx = line.indexOf('=')
                    String key = line.substring(0, idx).trim()
                    String val = line.substring(idx + 1).trim()
                    if (val.startsWith('"') && val.endsWith('"') && val.length() >= 2) {
                        val = val.substring(1, val.length() - 1)
                    } else if (val.startsWith("'") && val.endsWith("'") && val.length() >= 2) {
                        val = val.substring(1, val.length() - 1)
                    }
                    if (key) {
                        envMap[key] = val
                    }
                }
            }
        }
    }
    return envMap
}

def envMap = loadEnv()

tasks.named('test') {
    useJUnitPlatform()
    if (!envMap.isEmpty()) {
        environment envMap
    }
    // This host's Docker Engine enforces a minimum API version (1.44) and rejects older
    // requests outright. Testcontainers' docker-java client falls back to a hardcoded
    // RemoteApiVersion.VERSION_1_32 whenever no api.version is configured, which this
    // daemon refuses. Pin it via the docker-java "api.version" system property (the
    // highest version docker-java 3.4.x's RemoteApiVersion enum knows, which happens to
    // be exactly the daemon's floor) instead of a machine-local ~/.docker-java.properties file.
    systemProperty 'api.version', '1.44'
}

tasks.named('bootRun') {
    if (!envMap.isEmpty()) {
        environment envMap
    }
}
