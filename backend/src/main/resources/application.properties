spring.application.name=16-backend

# Server Configuration
server.port=${SERVER_PORT:${PORT:8080}}
server.servlet.context-path=/

# Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# JPA / Hibernate DDL: validated against Flyway migrations
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Actuator Health Probes (Strictly minimal: health only, zero internal details/metrics exposed)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Dynamic CORS Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://127.0.0.1:3000}

# Opaque bearer session tokens issued on login/register (30 days)
app.auth.token-ttl-hours=${APP_AUTH_TOKEN_TTL_HOURS:720}

# Test data: random self-tags for users without any (never runs under the prod profile)
app.tag-seed.enabled=${APP_TAG_SEED_ENABLED:false}

# Encryption key for sensitive fields at rest (phone numbers)
app.security.encryption-key=${APP_ENCRYPTION_KEY:connectionsbetween-us-default-secret-key-2026!}

# Firebase Cloud Messaging (push notifications): base64-encoded service-account JSON.
# Never sourced from the classpath — only this env var. Blank means push is disabled.
firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}

# Twilio Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}
twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}

# Textbelt OTP Configuration (disabled for local testing by default)
textbelt.enabled=${TEXTBELT_ENABLED:false}
textbelt.api-key=${TEXTBELT_API_KEY:example_otp_key}
textbelt.otp-lifetime=${TEXTBELT_OTP_LIFETIME:180}
textbelt.otp-length=${TEXTBELT_OTP_LENGTH:6}
textbelt.otp-message=${TEXTBELT_OTP_MESSAGE:Your verification code is $OTP. Valid for 3 minutes.}
textbelt.rate-limit.max-requests=${TEXTBELT_RATE_LIMIT_MAX_REQUESTS:5}
textbelt.rate-limit.window-seconds=${TEXTBELT_RATE_LIMIT_WINDOW_SECONDS:600}

# Rate limiting (S1, in-memory Bucket4j — single backend container, no Redis).
# IP-based limits on public auth endpoints:
app.rate-limit.ip.initiate-otp-per-hour=${RATE_LIMIT_IP_INITIATE_OTP_PER_HOUR:5}
app.rate-limit.ip.initiate-otp-per-day=${RATE_LIMIT_IP_INITIATE_OTP_PER_DAY:20}
app.rate-limit.ip.verify-otp-per-window=${RATE_LIMIT_IP_VERIFY_OTP_PER_WINDOW:10}
app.rate-limit.ip.verify-otp-window-minutes=${RATE_LIMIT_IP_VERIFY_OTP_WINDOW_MINUTES:15}
app.rate-limit.ip.register-per-hour=${RATE_LIMIT_IP_REGISTER_PER_HOUR:5}
app.rate-limit.ip.validate-invite-per-hour=${RATE_LIMIT_IP_VALIDATE_INVITE_PER_HOUR:30}
# Per-(normalized, hashed) phone number limits on actually sending an OTP:
app.rate-limit.phone.otp-send-per-hour=${RATE_LIMIT_PHONE_OTP_SEND_PER_HOUR:3}
app.rate-limit.phone.otp-send-per-day=${RATE_LIMIT_PHONE_OTP_SEND_PER_DAY:10}
# Per-authenticated-user overall throughput limit:
app.rate-limit.user.requests-per-minute=${RATE_LIMIT_USER_REQUESTS_PER_MINUTE:120}
# CIDRs (or bare addresses) trusted to set X-Real-IP — our own reverse proxy's network;
# anything else's X-Real-IP header is ignored in favor of the TCP peer address.
app.rate-limit.trusted-proxy-cidrs=${RATE_LIMIT_TRUSTED_PROXY_CIDRS:127.0.0.0/8,::1,172.16.0.0/12}
# Upper bound on distinct rate-limit keys held in memory at once, per bucket cache.
app.rate-limit.max-tracked-keys=${RATE_LIMIT_MAX_TRACKED_KEYS:100000}

# Invite codes (S4): registrations per invite code capped per day.
app.invite.max-registrations-per-day=${INVITE_MAX_REGISTRATIONS_PER_DAY:10}

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.demo=DEBUG

# Error Response Masking: never expose stack traces or internal details via default error endpoints
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never