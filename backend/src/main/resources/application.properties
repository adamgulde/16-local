spring.application.name=16-backend

# Server Configuration
server.port=${SERVER_PORT:${PORT:8080}}
server.servlet.context-path=/

# Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# JPA / Hibernate DDL: validated against Flyway migrations
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Actuator Health Probes (Strictly minimal: health only, zero internal details/metrics exposed)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Dynamic CORS Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://127.0.0.1:3000}

# Opaque bearer session tokens issued on login/register (30 days)
app.auth.token-ttl-hours=${APP_AUTH_TOKEN_TTL_HOURS:720}

# Encryption key for sensitive fields at rest (phone numbers)
app.security.encryption-key=${APP_ENCRYPTION_KEY:connectionsbetween-us-default-secret-key-2026!}

# Twilio SMS Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
twilio.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}

# Textbelt OTP Configuration (disabled for local testing by default)
textbelt.enabled=${TEXTBELT_ENABLED:false}
textbelt.api-key=${TEXTBELT_API_KEY:example_otp_key}
textbelt.otp-lifetime=${TEXTBELT_OTP_LIFETIME:180}
textbelt.otp-length=${TEXTBELT_OTP_LENGTH:6}
textbelt.otp-message=${TEXTBELT_OTP_MESSAGE:Your verification code is $OTP. Valid for 3 minutes.}
textbelt.rate-limit.max-requests=${TEXTBELT_RATE_LIMIT_MAX_REQUESTS:5}
textbelt.rate-limit.window-seconds=${TEXTBELT_RATE_LIMIT_WINDOW_SECONDS:600}

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.demo=DEBUG