# Spring Boot Test Configuration
# Uses update so Testcontainers PostgreSQL schema is created cleanly and avoids shutdown drop-table connection timeout
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Dynamic Datasource: connects to external database (e.g. Supabase Staging) if configured in .env
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Disable Flyway during ephemeral test container execution
spring.flyway.enabled=false

# Mock Twilio properties for tests
twilio.account-sid=ACmocktestaccountsid00000000000000
twilio.auth-token=mocktestauthtoken0000000000000000
twilio.phone-number=+15550000000
twilio.verify-service-sid=VAmocktestverifyservice0000000000

# Auth token TTL
app.auth.token-ttl-hours=168

# CORS
app.cors.allowed-origins=http://localhost:5173
