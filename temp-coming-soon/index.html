<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>16 — Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f7f7fb;
      background: radial-gradient(circle at 20% 20%, #4a4adf 0%, #111 42%, #090909 100%);
    }
    main {
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      border-radius: 999px;
      border: 2px solid #f7f7fb;
      display: grid;
      place-items: center;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: 0.05em;
    }
    p {
      margin: 14px 0 0;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-label="16 logo">16</div>
    <h1>Coming Soon</h1>
    <p>Launching 9/16</p>
  </main>
</body>
</html>
