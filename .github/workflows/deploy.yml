name: Deploy Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Run Backend Tests
        run: |
          cd backend
          gradle test --no-daemon

      - name: Build Backend Jar
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          cd backend
          gradle bootJar -x test --no-daemon

  ci-frontend:
    name: Frontend Lint & Build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend Build
        run: |
          cd frontend
          npm run build

  deploy-production:
    name: Deploy to Production
    needs: [ci-backend, ci-frontend]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production Host
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: |
          echo "Deploying to production with production database..."
          if [ -z "$SPRING_DATASOURCE_URL" ]; then
            echo "WARNING: SPRING_DATASOURCE_URL secret is not set for production environment."
          else
            echo "Production database secret detected."
          fi

      - name: Deploy via SSH to Production VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME || 'postgres' }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS || 'http://localhost,http://localhost:80' }}
          CLOUDFLARE_ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          CLOUDFLARE_ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
        with:
          host: ${{ secrets.SSH_HOST_PROD || secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER_PROD || secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_PROD || secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT_PROD || secrets.SSH_PORT || 22 }}
          envs: SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_PHONE_NUMBER,TWILIO_VERIFY_SERVICE_SID,TWILIO_MESSAGING_SERVICE_SID,CORS_ALLOWED_ORIGINS,CLOUDFLARE_ORIGIN_CERT,CLOUDFLARE_ORIGIN_KEY
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH_PROD || secrets.DEPLOY_PATH || '/opt/app' }}"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "Searching for git repository on host..."
              for candidate in "$DEPLOY_DIR/16" "/opt/16" "/opt/app" "/opt/app/16" "$HOME/16" "$HOME/app" "/root/16"; do
                if [ -d "$candidate/.git" ]; then
                  DEPLOY_DIR="$candidate"
                  echo "Found repository at $DEPLOY_DIR"
                  break
                fi
              done
              if [ ! -d "$DEPLOY_DIR/.git" ]; then
                AUTO_FOUND=$(find /opt /root /home -maxdepth 3 -name ".git" -type d 2>/dev/null | head -n 1)
                if [ -n "$AUTO_FOUND" ]; then
                  DEPLOY_DIR=$(dirname "$AUTO_FOUND")
                  echo "Auto-detected repository at $DEPLOY_DIR"
                fi
              fi
            fi
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "FATAL: Could not locate git repository on host in $DEPLOY_DIR, /opt, or $HOME."
              ls -la "$DEPLOY_DIR" 2>/dev/null || true
              exit 1
            fi
            echo "Deploying Production to $DEPLOY_DIR..."
            cd "$DEPLOY_DIR"
            git config --global --add safe.directory "$DEPLOY_DIR" || true
            git fetch origin main
            git checkout main
            git pull origin main

            # Provision Cloudflare SSL certificates if provided
            mkdir -p certs
            if [ -n "$CLOUDFLARE_ORIGIN_CERT" ]; then
              echo "$CLOUDFLARE_ORIGIN_CERT" > certs/origin.crt
              chmod 644 certs/origin.crt
            fi
            if [ -n "$CLOUDFLARE_ORIGIN_KEY" ]; then
              echo "$CLOUDFLARE_ORIGIN_KEY" > certs/origin.key
              chmod 600 certs/origin.key
            fi

            # Update .env with Supabase database and Twilio secrets
            cat << EOF > .env
            SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL
            SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME
            SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD
            TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID
            TWILIO_AUTH_TOKEN=$TWILIO_AUTH_TOKEN
            TWILIO_PHONE_NUMBER=$TWILIO_PHONE_NUMBER
            TWILIO_VERIFY_SERVICE_SID=$TWILIO_VERIFY_SERVICE_SID
            TWILIO_MESSAGING_SERVICE_SID=$TWILIO_MESSAGING_SERVICE_SID
            CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS
            EOF

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull || true
            if ! docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans; then
              echo "=========================================="
              echo "DEPLOYMENT FAILED: Dumping container logs"
              echo "=========================================="
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=100 backend || true
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 proxy || true
              exit 1
            fi
            docker system prune -f
