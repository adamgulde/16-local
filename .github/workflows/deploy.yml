name: Deploy Application

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment to Deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Run Backend Tests
        run: |
          cd backend
          gradle test --no-daemon

      - name: Build Backend Jar
        run: |
          cd backend
          gradle bootJar -x test --no-daemon

  ci-frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend Build
        run: |
          cd frontend
          npm run build

  deploy-staging:
    name: Deploy to Staging
    needs: [ci-backend, ci-frontend]
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Staging Host
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: |
          echo "Deploying to staging with staging database..."
          if [ -z "$SPRING_DATASOURCE_URL" ]; then
            echo "WARNING: SPRING_DATASOURCE_URL secret is not set for staging environment."
          else
            echo "Staging database secret detected."
          fi

      - name: Deploy via SSH to Staging VPS
        if: ${{ secrets.SSH_HOST != '' || secrets.SSH_HOST_STAGING != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME || 'postgres' }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS || 'http://localhost,http://localhost:80' }}
          CLOUDFLARE_ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          CLOUDFLARE_ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
        with:
          host: ${{ secrets.SSH_HOST_STAGING || secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER_STAGING || secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_STAGING || secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT_STAGING || secrets.SSH_PORT || 22 }}
          envs: SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_PHONE_NUMBER,CORS_ALLOWED_ORIGINS,CLOUDFLARE_ORIGIN_CERT,CLOUDFLARE_ORIGIN_KEY
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH_STAGING || secrets.DEPLOY_PATH || '/opt/app-staging' }}"
            echo "Deploying Staging to $DEPLOY_DIR..."
            cd "$DEPLOY_DIR"
            git fetch origin staging
            git checkout staging
            git pull origin staging

            # Provision Cloudflare SSL certificates if provided
            mkdir -p certs
            if [ -n "$CLOUDFLARE_ORIGIN_CERT" ]; then
              echo "$CLOUDFLARE_ORIGIN_CERT" > certs/origin.crt
              chmod 644 certs/origin.crt
            fi
            if [ -n "$CLOUDFLARE_ORIGIN_KEY" ]; then
              echo "$CLOUDFLARE_ORIGIN_KEY" > certs/origin.key
              chmod 600 certs/origin.key
            fi

            # Update .env with Supabase database and Twilio secrets
            cat << EOF > .env
            SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL
            SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME
            SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD
            TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID
            TWILIO_AUTH_TOKEN=$TWILIO_AUTH_TOKEN
            TWILIO_PHONE_NUMBER=$TWILIO_PHONE_NUMBER
            CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS
            EOF

            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull || true
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build --remove-orphans
            docker system prune -f

  deploy-production:
    name: Deploy to Production
    needs: [ci-backend, ci-frontend]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production Host
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: |
          echo "Deploying to production with production database..."
          if [ -z "$SPRING_DATASOURCE_URL" ]; then
            echo "WARNING: SPRING_DATASOURCE_URL secret is not set for production environment."
          else
            echo "Production database secret detected."
          fi

      - name: Deploy via SSH to Production VPS
        if: ${{ secrets.SSH_HOST != '' || secrets.SSH_HOST_PROD != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME || 'postgres' }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS || 'http://localhost,http://localhost:80' }}
          CLOUDFLARE_ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          CLOUDFLARE_ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
        with:
          host: ${{ secrets.SSH_HOST_PROD || secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER_PROD || secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY_PROD || secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT_PROD || secrets.SSH_PORT || 22 }}
          envs: SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_PHONE_NUMBER,CORS_ALLOWED_ORIGINS,CLOUDFLARE_ORIGIN_CERT,CLOUDFLARE_ORIGIN_KEY
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH_PROD || secrets.DEPLOY_PATH || '/opt/app-prod' }}"
            echo "Deploying Production to $DEPLOY_DIR..."
            cd "$DEPLOY_DIR"
            git fetch origin main
            git checkout main
            git pull origin main

            # Provision Cloudflare SSL certificates if provided
            mkdir -p certs
            if [ -n "$CLOUDFLARE_ORIGIN_CERT" ]; then
              echo "$CLOUDFLARE_ORIGIN_CERT" > certs/origin.crt
              chmod 644 certs/origin.crt
            fi
            if [ -n "$CLOUDFLARE_ORIGIN_KEY" ]; then
              echo "$CLOUDFLARE_ORIGIN_KEY" > certs/origin.key
              chmod 600 certs/origin.key
            fi

            # Update .env with Supabase database and Twilio secrets
            cat << EOF > .env
            SPRING_DATASOURCE_URL=$SPRING_DATASOURCE_URL
            SPRING_DATASOURCE_USERNAME=$SPRING_DATASOURCE_USERNAME
            SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD
            TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID
            TWILIO_AUTH_TOKEN=$TWILIO_AUTH_TOKEN
            TWILIO_PHONE_NUMBER=$TWILIO_PHONE_NUMBER
            CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS
            EOF

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
            docker system prune -f
